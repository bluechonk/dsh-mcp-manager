# dsh-mcp-manager —— 「MCP 服务器」分区插件 loader 配置。
#
# id  : 插件在宿主里的稳定标识，与 npm 包名保持一致（@bluechonk/dsh-mcp-manager）。
#       改它会丢用户配置，勿动；卸载时用这个 id 在插件管理器里定位。
# name: npm 包名（scope 版），宿主按此名在 profile 的 node_modules 里解析插件包。
#
# host 半(lib/index.js)：挂同源 HTTP 路由，按作用域读写 MCP 服务器清单，
#                        并用官方 @deepseek-ai/dsh-mcp-client 在运行期挂载/卸载连接。
# client 半(client/client.js)：注册 settings.section order 10.5「MCP 服务器」分区
#                              （紧贴「模型」(10) 下方、「技能」(11) 上方）。
#
# 回滚：plugin remove（或本 patch enabled:false）；插件自身只读写作用域内的
#       mcp-manager/servers.json，不改动宿主任何配置。
- insert:
    - id: '@bluechonk/dsh-mcp-manager'
      name: '@bluechonk/dsh-mcp-manager'
      config: {}
